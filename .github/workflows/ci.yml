name: SnapRuletka CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services: 
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: snapruletka
          POSTGRES_PASSWORD: snapruletka
          POSTGRES_DB: snapruletka
        ports:
         - 5438:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9003:9000
          - 9002:9002
        
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql+psycopg://snapruletka:snapruletka@localhost:5432/snapruletka_test" >> .env
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "S3_ENDPOINT=http://localhost:9000" >> .env
          echo "S3_ACCESS_KEY=minioadmin" >> .env
          echo "S3_SECRET_KEY=minioadmin" >> .env
          echo "S3_BUCKET=snapruletka" >> .env
          echo "S3_REGION=us-east-1" >> .env
          echo "S3_USE_SSL=False" >> .env

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U snapruletka && break
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Create MinIO bucket
        run: |
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/snapruletka || echo "Bucket may already exist"

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -v
